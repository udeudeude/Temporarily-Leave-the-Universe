<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bdb5a0"><title>Temporarily Leave the Universe</title>
<style>
:root{color-scheme:dark;--ink:#85ff9a;--glow:rgba(85,235,75,.35);--bg:#020802;font-family:"Courier New",monospace}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080b08;overflow:hidden}
body{height:100dvh}#shell{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:var(--bg)}
#bar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid color-mix(in srgb,var(--ink) 35%,transparent);font:11px system-ui,sans-serif;color:var(--ink)}
#bar strong{flex:1;letter-spacing:.1em;font-weight:600}button{background:transparent;border:1px solid var(--ink);color:var(--ink);border-radius:4px;padding:6px 9px;font:inherit;cursor:pointer}
button:focus-visible,#command:focus-visible{outline:2px solid white;outline-offset:2px}
#screen{position:relative;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:clamp(12px,4vw,28px);font-size:clamp(15px,4.1vw,21px);line-height:1.38;color:var(--ink);text-shadow:0 0 6px var(--glow),0 0 16px var(--glow);white-space:pre-wrap;overflow-wrap:anywhere}
#screen::after{content:"";pointer-events:none;position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.18) 3px 4px);opacity:var(--scan,.55)}
#screen::before{content:"";pointer-events:none;position:fixed;inset:0;box-shadow:inset 0 0 70px 18px rgba(0,0,0,.55);border-radius:16px}
#output{margin:0;font:inherit}#entry{display:flex;align-items:baseline;gap:.5ch;margin-top:.4em}#prompt{flex:none}#command{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;caret-color:var(--ink);padding:0;margin:0;text-shadow:inherit;border-radius:0}
#footer{flex:none;padding:6px 12px 8px;display:flex;gap:10px;align-items:center;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent);color:var(--ink);font:11px system-ui,sans-serif}#footer span{flex:1;opacity:.7}
#settings{position:absolute;right:10px;top:48px;z-index:5;background:#081008;color:var(--ink);border:1px solid var(--ink);padding:14px;display:none;min-width:220px;font:14px system-ui,sans-serif;box-shadow:0 6px 30px #000}#settings.open{display:grid;gap:12px}#settings label{display:flex;justify-content:space-between;gap:15px;align-items:center}#settings input{accent-color:var(--ink)}#settings select{background:#111;color:var(--ink);border:1px solid var(--ink);padding:5px}
@media(min-width:700px){#screen{font-size:12px;padding:32px max(30px,calc((100vw - 850px)/2))}}
@media(prefers-reduced-motion:no-preference){#prompt{animation:blink 1.15s steps(2) infinite}@keyframes blink{50%{opacity:.35}}}

/* The beige bezel is the housing; the inset dark glass is the actual display. */
:root{--ink:#77ef70;--glow:rgba(85,235,75,.16);--bg:#010401;--scan:1;--glass:#010501}
html,body{background:#010401}
#shell{background:#010401;padding:calc(env(safe-area-inset-top) + 7px) 9px calc(env(safe-area-inset-bottom) + 7px);gap:0}
#bar{background:transparent;border:0;color:var(--ink);padding:2px 8px 8px;font:12px "Courier New",monospace}
#bar strong{letter-spacing:.03em}
button{border:1px solid var(--ink);color:var(--ink);background:#010601;border-radius:2px;font:12px "Courier New",monospace;box-shadow:none}
#screen{background:radial-gradient(ellipse at center,#061006 0%,var(--glass) 77%);border:solid 2px #244529;border-radius:clamp(20px,5vw,38px) / clamp(15px,4vw,28px);box-shadow:inset 0 0 0 2px #121912,inset 0 0 22px 8px #000,0 0 7px 2px var(--glow),0 0 17px 1px var(--glow);padding:clamp(16px,4.5vw,32px);font-family:"Courier New",monospace;font-size:12px;line-height:1.34;overflow-x:hidden;overflow-y:auto;white-space:normal;text-shadow:0 0 3px var(--glow),0 0 9px var(--glow)}
#screen::after{position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,rgba(0,0,0,.16) 4px);opacity:var(--scan);z-index:2}
#screen::before{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 28px 8px #000,inset 0 0 2px 2px #394238;z-index:2}
#output{white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;max-width:100%;font:inherit}
#entry{min-width:0;max-width:100%;align-items:baseline}
#prompt{display:none}
#command{text-transform:uppercase;min-width:0;width:100%;font:inherit;caret-color:transparent;overflow:hidden}
#entry:before{content:"";width:.65em;height:1.05em;background:var(--ink);box-shadow:0 0 5px var(--glow);flex:none;animation:cursorblink 1.05s steps(2,start) infinite}
#entry:focus-within:before{display:none}
#entry:focus-within #command{caret-color:var(--ink)}
@keyframes cursorblink{50%{opacity:0}}
#footer{background:transparent;color:#4b4539;border:0;padding:9px 6px 2px}
#settings{top:45px;right:10px;left:10px;min-width:0;background:#020902;color:var(--ink);border:1px solid var(--ink);box-shadow:0 0 10px var(--glow);font:14px "Courier New",monospace}
#settings input{accent-color:#5d594d;max-width:45%}
#settings button{justify-self:stretch}
#settings label{min-height:32px}
@media(min-width:700px){#shell{padding-left:max(9px,calc((100vw - 950px)/2));padding-right:max(9px,calc((100vw - 950px)/2))}}

/* Simulated NTSC composite artifacting: RGB color fringes around white pixels. */
#shell.tv{--ink:#f5f5f5;--glow:rgba(255,255,255,.3)}
#shell.tv #screen{color:#f3f3f3;text-shadow:-1px 0 #27e1aa,1px 0 #a844ef,0 0 5px #a767e4}
#shell.tv #output,#shell.tv #command{filter:drop-shadow(-.8px 0 #20d1b7) drop-shadow(.8px 0 #d35a78)}
#shell.tv #screen::after{background:repeating-linear-gradient(to bottom,transparent 0px,transparent 2px,rgba(0,0,0,.27) 3px)}
#splash{display:none;position:absolute;inset:0;z-index:3;overflow:auto;padding:18px 12px;background:#010501;color:var(--ink);font:12px/1.22 "Courier New",monospace;text-shadow:0 0 4px var(--glow)}#splash.visible{display:block}#splash .art{position:relative;width:min(100%,480px);height:310px;margin:auto}#splash .dragon{position:absolute;right:0;top:0;width:68%;height:88%;object-fit:contain;filter:drop-shadow(0 0 2px var(--glow))}#splash .intro{position:absolute;left:0;top:0;width:45%;white-space:pre-wrap}#splash .credit{position:absolute;left:0;bottom:0;width:100%;white-space:pre-wrap;text-align:center}#splash .continue{text-align:center;margin-top:12px;animation:cursorblink 1.1s steps(2) infinite}#shell.tv #splash .dragon{filter:drop-shadow(-1px 0 #d5474c) drop-shadow(1px 0 #287cfd)}@media(min-width:600px){#splash{font-size:16px}#splash .art{height:390px}}
/* No illuminated outline: illumination is inside the glass edge and fades inward. */
#screen{border:0;border-radius:24px;box-shadow:inset 0 0 2px 2px rgba(120,245,110,.42),inset 0 0 10px 3px rgba(95,230,85,.24),inset 0 0 32px 7px rgba(60,170,65,.10);background:radial-gradient(ellipse at center,#010501 60%,#071707 100%)}
#screen::before{box-shadow:inset 0 0 1px 1px rgba(120,245,110,.2),inset 0 0 22px 4px rgba(0,0,0,.58)}
#splash{padding:clamp(10px,3vw,24px);font-size:clamp(10px,2.7vw,15px);line-height:1.18;white-space:normal;overflow-x:hidden}
#splash .splash-layout{width:100%;max-width:530px;margin:0 auto;display:grid;grid-template-columns:39% 61%;align-items:start;min-height:0}
#splash .splash-intro{position:static;white-space:normal;min-width:0;padding-top:6px}
#splash .splash-title{display:inline-block;margin:3px 0 14px;font-weight:bold}
#splash .splash-intro p{margin:0}
#splash .dragon{position:static;width:100%;height:auto;max-height:280px;object-fit:contain;align-self:start}
#splash .splash-credit{position:static;text-align:center;margin:8px auto 0;max-width:100%;overflow-wrap:normal}
#splash .continue{margin-top:20px}
#shell.tv #screen{box-shadow:inset 0 0 2px 2px rgba(230,230,255,.42),inset 0 0 16px 4px rgba(160,110,230,.17)}
@media(min-width:600px){#splash{font-size:15px}#splash .dragon{max-height:360px}}
</style></head><body><main id="shell"><header id="bar"><strong>EAMON</strong><button id="theme" type="button" aria-label="Cycle display mode">AMBER</button><button id="gear" type="button" aria-label="Display controls" aria-expanded="false">CTRL</button></header><aside id="settings" aria-label="Terminal settings"><label>Scanlines <input id="scan" type="range" min="0" max="200" value="100"></label><label>Glow <input id="glow" type="range" min="0" max="100" value="50"></label><label>Text size <input id="size" type="range" min="6" max="18" value="12"></label><button id="reset" type="button">RESET DEMO</button></aside><section id="screen" aria-label="Text adventure terminal"><div id="splash" aria-label="Eamon opening screen"><div class="splash-layout"><div class="splash-intro"><div>Welcome to</div><div class="splash-title">EAMON</div><p>The computerized<br>fantasy role-playing<br>system designed for<br>the Apple II.</p></div><img class="dragon" src="dragon.svg" alt="Dragon illustration"></div><div class="splash-credit">EAMON is a creation of Donald Brown<br>Non-commercial distribution welcomed</div><div class="continue">PRESS RETURN TO CONTINUE</div></div><pre id="output" aria-live="polite"></pre><form id="entry" autocomplete="off"><span id="prompt">]</span><input id="command" aria-label="Type a command" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"></form></section><footer id="footer"><span>READY</span><button id="focus" type="button">TYPE</button><button id="help" type="button">HELP</button></footer></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),out=$('output'),cmd=$('command'),screen=$('screen');let amber=false,tv=false,history=[],hi=0;
let state={room:'hall',inventory:[],door:false,done:false};
const rooms={hall:'YOU ARE IN THE MAIN HALL.\n\nA CLERK IS COUNTING DOORS. THERE ARE SEVEN. HIS LEDGER SAYS EIGHT.\n\nA SIGN READS: EXHIBIT 1 - THE VERB MERCHANT.\n\nEXITS: NORTH.',shop:'THE VERB MERCHANT\n\nA SMALL MAN SITS BEHIND A COUNTER.\n\nHE SELLS WORDS IN GLASS JARS.\n\nA JAR MARKED OPEN IS EMPTY.\nA JAR MARKED REMEMBER IS FULL.\n\nEXITS: SOUTH.'};
function print(s=''){out.textContent+=(out.textContent?'\n':'')+s;requestAnimationFrame(()=>screen.scrollTop=screen.scrollHeight)}
const dragon=[
'             /\\     /\\',
'        /\\  /  \\___/  \\',
'       /  \\/           \\',
'      /       /\\    /\\  \\',
'     /___    (  )  (  )  |',
'         \\       ^      /',
'          \\   \\___/    /',
'       ____/            /',
'      /     /\\   /\\   /',
'     /_____/  \\_/  \\_/'
].join('\n');
let splash=true;
function boot(){splash=true;$('splash').classList.add('visible');state={room:'hall',inventory:[],door:false,done:false};out.textContent='';print('THE WONDERFUL WORLD OF EAMON\n\n'+dragon+'\n\nPRESS RETURN TO CONTINUE.\n\nCOPYRIGHT 1985+21')}
function execute(raw){let t=raw.trim(),v=t.toLowerCase();if(splash){splash=false;$('splash').classList.remove('visible');out.textContent='';print('TEMPORARILY LEAVE THE UNIVERSE\n\nDISK 01 - THE MUSEUM\nCOPYRIGHT 1985+21\n\n'+rooms.hall+'\n\nTYPE HELP FOR COMMANDS.');return}print('> '+t.toUpperCase());if(!v)return;
if(['help','?'].includes(v))return print('COMMANDS: LOOK, NORTH, SOUTH, EXAMINE, TAKE, INVENTORY, TALK, OPEN, REMEMBER, HELP, CLEAR, RESTART.\n\nTRY EXAMINE LEDGER OR TALK CLERK.');
if(v==='clear'){out.textContent='';return}
if(v==='restart')return boot();
if(v==='look'||v==='l')return print(rooms[state.room]+(state.door?'\n\nAN EIGHTH DOOR IS OPEN.':''));
if(v==='inventory'||v==='i')return print(state.inventory.length?'YOU CARRY: '+state.inventory.join(', ').toUpperCase():'YOU ARE EMPTY-HANDED.');
if(v==='north'||v==='n'||v==='go north'){if(state.room==='hall'){state.room='shop';return print(rooms.shop)}return print('THERE IS NO EXIT NORTH.')}
if(v==='south'||v==='s'||v==='go south'){if(state.room==='shop'){state.room='hall';return print(rooms.hall)}return print('THERE IS NO EXIT SOUTH.')}
if(v.startsWith('talk'))return print(state.room==='hall'?'"THE EIGHTH DOOR IS NOT MISSING," SAYS THE CLERK. "IT HAS NOT YET BEEN COUNTED."':'"THE WORD REMEMBER IS FREE," SAYS THE MERCHANT. "BUT YOU MUST CARRY IT YOURSELF."');
if(v.includes('ledger')&&(v.startsWith('examine')||v.startsWith('read')||v.startsWith('look')))return print('SEVEN DOORS ARE LISTED. THE EIGHTH ENTRY READS: REMEMBER.');
if(v.includes('jar')||v.includes('counter'))return print(state.room==='shop'?'THE REMEMBER JAR HAS NO LID.':'YOU SEE NOTHING OF THE SORT.');
if(v==='take remember'||v==='take word'||v==='take jar'){if(state.room!=='shop')return print('YOU SEE NO SUCH THING.');if(!state.inventory.includes('remember'))state.inventory.push('remember');return print('YOU TAKE THE WORD REMEMBER. IT WEIGHS ALMOST NOTHING.')}
if(v==='remember'){if(!state.inventory.includes('remember'))return print('YOU CANNOT REMEMBER WHAT YOU DO NOT POSSESS.');if(state.room==='hall'){state.door=true;return print('THE CLERK COUNTS AGAIN.\n\nONE. TWO. THREE. FOUR. FIVE. SIX. SEVEN. EIGHT.\n\nAN EIGHTH DOOR APPEARS.\n\nTYPE OPEN DOOR.')}return print('YOU REMEMBER A DOOR THAT IS NOT HERE.')}
if(v==='open door'){if(state.room==='hall'&&state.door){state.done=true;return print('THE EIGHTH DOOR OPENS ONTO THE MAIN HALL.\n\nYOU HAVE COMPLETED THE FIRST IMPOSSIBLE ADVENTURE.\n\nTHE CLERK MAKES A SMALL MARK IN HIS LEDGER.\n\nEND OF DEMONSTRATION.')}return print('YOU CANNOT OPEN THAT.')}
if(v.startsWith('examine')||v.startsWith('look at'))return print('YOU FIND NOTHING UNUSUAL. WHICH IS UNUSUAL.');
return print("I DON'T UNDERSTAND THAT COMMAND.");
}
$('entry').addEventListener('submit',e=>{e.preventDefault();const t=cmd.value;cmd.value='';if(t.trim()){history.push(t.toUpperCase());hi=history.length}execute(t);cmd.focus()});
cmd.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)cmd.value=history[--hi]||''}if(e.key==='ArrowDown'){e.preventDefault();if(hi<history.length)hi++;cmd.value=history[hi]||''}});
const modes=['green','amber','tv'];let mode=modes.includes(localStorage.getItem('tltu-theme'))?localStorage.getItem('tltu-theme'):'green';
function applyMode(){amber=mode==='amber';tv=mode==='tv';$('shell').classList.toggle('tv',tv);document.documentElement.style.setProperty('--ink',tv?'#f5f5f5':amber?'#ffbf00':'#77ef70');const strength=Number($('glow').value)/100;document.documentElement.style.setProperty('--glow',tv?'rgba(245,245,245,'+strength+')':amber?'rgba(255,176,0,'+strength+')':'rgba(85,235,75,'+strength+')');$('theme').textContent=mode==='green'?'AMBER':mode==='amber'?'T.V.':'GREEN';$('theme').setAttribute('aria-label','Display: '+mode.toUpperCase()+'. Change to '+$('theme').textContent);localStorage.setItem('tltu-theme',mode)}
$('theme').onclick=()=>{mode=modes[(modes.indexOf(mode)+1)%3];applyMode()};applyMode();
$('gear').onclick=()=>{const open=$('settings').classList.toggle('open');$('gear').setAttribute('aria-expanded',String(open))};
$('scan').oninput=e=>document.documentElement.style.setProperty('--scan',e.target.value/100*.65);
$('glow').oninput=()=>applyMode();
$('size').oninput=e=>screen.style.fontSize=e.target.value+'px';
$('reset').onclick=()=>{boot();$('settings').classList.remove('open')};
$('focus').onclick=()=>cmd.focus();$('help').onclick=()=>{execute('help');cmd.focus()};
screen.addEventListener('click',e=>{if(e.target===screen||e.target===out)cmd.focus()});
if(window.visualViewport){const resize=()=>{document.getElementById('shell').style.height=window.visualViewport.height+'px';document.getElementById('shell').style.top=window.visualViewport.offsetTop+'px';screen.scrollTop=screen.scrollHeight};window.visualViewport.addEventListener('resize',resize);window.visualViewport.addEventListener('scroll',resize);resize()}
$('splash').addEventListener('click',()=>{execute('');cmd.focus()});
boot();
})();
</script></body></html>
