if(v==='inventory'||v==='i')return print(state.inventory.length?'YOU CARRY: '+state.inventory.join(', ').toUpperCase():'YOU ARE EMPTY-HANDED.');
if(v==='north'||v==='n'||v==='go north'){if(state.room==='hall'){state.room='shop';return print(rooms.shop)}return print('THERE IS NO EXIT NORTH.')}
if(v==='south'||v==='s'||v==='go south'){if(state.room==='shop'){state.room='hall';return print(rooms.hall)}return print('THERE IS NO EXIT SOUTH.')}
if(v.startsWith('talk'))return print(state.room==='hall'?'"THE EIGHTH DOOR IS NOT MISSING," SAYS THE CLERK. "IT HAS NOT YET BEEN COUNTED."':'"THE WORD REMEMBER IS FREE," SAYS THE MERCHANT. "BUT YOU MUST CARRY IT YOURSELF."');
if(v.includes('ledger')&&(v.startsWith('examine')||v.startsWith('read')||v.startsWith('look')))return print('SEVEN DOORS ARE LISTED. THE EIGHTH ENTRY READS: REMEMBER.');
if(v.includes('jar')||v.includes('counter'))return print(state.room==='shop'?'THE REMEMBER JAR HAS NO LID.':'YOU SEE NOTHING OF THE SORT.');
if(v==='take remember'||v==='take word'||v==='take jar'){if(state.room!=='shop')return print('YOU SEE NO SUCH THING.');if(!state.inventory.includes('remember'))state.inventory.push('remember');return print('YOU TAKE THE WORD REMEMBER. IT WEIGHS ALMOST NOTHING.')}
if(v==='remember'){if(!state.inventory.includes('remember'))return print('YOU CANNOT REMEMBER WHAT YOU DO NOT POSSESS.');if(state.room==='hall'){state.door=true;return print('THE CLERK COUNTS AGAIN.\n\nONE. TWO. THREE. FOUR. FIVE. SIX. SEVEN. EIGHT.\n\nAN EIGHTH DOOR APPEARS.\n\nTYPE OPEN DOOR.')}return print('YOU REMEMBER A DOOR THAT IS NOT HERE.')}
if(v==='open door'){if(state.room==='hall'&&state.door){state.done=true;return print('THE EIGHTH DOOR OPENS ONTO THE MAIN HALL.\n\nYOU HAVE COMPLETED THE FIRST IMPOSSIBLE ADVENTURE.\n\nTHE CLERK MAKES A SMALL MARK IN HIS LEDGER.\n\nEND OF DEMONSTRATION.')}return print('YOU CANNOT OPEN THAT.')}
if(v.startsWith('examine')||v.startsWith('look at'))return print('YOU FIND NOTHING UNUSUAL. WHICH IS UNUSUAL.');
return print("I DON'T UNDERSTAND THAT COMMAND.");
}
cmd.addEventListener('input',()=>document.getElementById('entry').classList.toggle('has-text',cmd.value.length>0));
$('entry').addEventListener('submit',e=>{e.preventDefault();const t=cmd.value;cmd.value='';$('entry').classList.remove('has-text');if(t.trim()){history.push(t.toUpperCase());hi=history.length}execute(t);cmd.focus()});
cmd.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)cmd.value=history[--hi]||''}if(e.key==='ArrowDown'){e.preventDefault();if(hi<history.length)hi++;cmd.value=history[hi]||''}});
const modes=['green','amber','tv'];let mode=modes.includes(localStorage.getItem('tltu-theme'))?localStorage.getItem('tltu-theme'):'green';
function applyMode(){amber=mode==='amber';tv=mode==='tv';$('shell').classList.toggle('tv',tv);$('shell').classList.toggle('amber',amber);document.documentElement.style.setProperty('--ink',tv?'#f5f5f5':amber?'#ffbf00':'#77ef70');const strength=Math.min(1,Number($('glow').value)/180);document.documentElement.style.setProperty('--glow',tv?'rgba(245,245,245,'+strength+')':amber?'rgba(255,176,0,'+strength+')':'rgba(85,235,75,'+strength+')');$('theme').textContent=mode==='green'?'AMBER':mode==='amber'?'T.V.':'GREEN';$('theme').setAttribute('aria-label','Display: '+mode.toUpperCase()+'. Change to '+$('theme').textContent);localStorage.setItem('tltu-theme',mode)}
$('theme').onclick=()=>{mode=modes[(modes.indexOf(mode)+1)%3];applyMode()};applyMode();
$('gear').onclick=()=>{const open=$('settings').classList.toggle('open');$('gear').setAttribute('aria-expanded',String(open))};
$('scan').oninput=e=>document.documentElement.style.setProperty('--scan-dark',(Number(e.target.value)/300*.94).toFixed(3));$('scan').dispatchEvent(new Event('input'));
$('glow').oninput=()=>applyMode();
$('size').oninput=e=>screen.style.fontSize=e.target.value+'px';
$('reset').onclick=()=>{boot();$('settings').classList.remove('open')};
$('focus').onclick=()=>cmd.focus();$('help').onclick=()=>{execute('help');cmd.focus()};
screen.addEventListener('click',e=>{if(e.target===screen||e.target===out)cmd.focus()});
if(window.visualViewport){const resize=()=>{document.getElementById('shell').style.height=window.visualViewport.height+'px';document.getElementById('shell').style.top=window.visualViewport.offsetTop+'px';screen.scrollTop=screen.scrollHeight};window.visualViewport.addEventListener('resize',resize);window.visualViewport.addEventListener('scroll',resize);resize()}
$('splash').addEventListener('click',()=>{execute('');cmd.focus()});
boot();
})();
